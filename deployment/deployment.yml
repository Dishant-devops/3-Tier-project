apiVersion: apps/v1
kind: Deployment
metadata:
  name: 3-tier-app-deployment
  namespace: 3-tier
  labels:
    app: 3-tier-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: 3-tier-app
  template:
    metadata:
      labels:
        app: 3-tier-app
    spec:
      containers:
        - name: app
          image: IMAGE_PLACEHOLDER
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: app-secrets
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 20