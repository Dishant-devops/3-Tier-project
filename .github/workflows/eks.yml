name: 'Deploy to EKS'

on:
  workflow_run:
    workflows: [ "Build and Push to Docker Hub" ]
    types:
      - completed

permissions:
  id-token: write   # Required for AWS OIDC
  contents: read

env:
  AWS_REGION: us-east-1
  EKS_CLUSTER_NAME: my-cluster
  DOCKERHUB_REPO: dishant11/3-tier
  K8S_MANIFESTS_DIR: ./deployment
  NAMESPACE: 3-tier

jobs:
  deploy:
    name: 'Deploy to EKS'
    runs-on: ubuntu-latest
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      (github.event.workflow_run.head_branch == 'main' ||
       github.event.workflow_run.head_branch == 'Dev-infra')

    steps:
      - name: Checkout 
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --name $EKS_CLUSTER_NAME --region $AWS_REGION

      - name: Create namespace if not exists
        run: |
          kubectl create namespace $NAMESPACE --dry-run=client -o yaml | kubectl apply -f -

      - name: Create secret.yml from secrets
        run: |
          cat <<EOF > secret.yml
          apiVersion: v1
          kind: Secret
          metadata:
            name: app-secrets
            namespace: ${{ env.NAMESPACE }}
          type: Opaque
          stringData:
            DB_URL: "${{ secrets.DB_URL }}"
            SECRET: "${{ secrets.APP_SECRET }}"
            CLOUDINARY_CLOUD_NAME: "${{ secrets.CLOUDINARY_CLOUD_NAME }}"
            CLOUDINARY_KEY: "${{ secrets.CLOUDINARY_KEY }}"
            CLOUDINARY_SECRET: "${{ secrets.CLOUDINARY_SECRET }}"
            MAPBOX_TOKEN: "${{ secrets.MAPBOX_TOKEN }}"
          EOF

      - name: Apply secret to cluster
        run: kubectl apply -f secret.yml

      - name: Set image in deployment manifest
        env:
          IMAGE_TAG: ${{ github.event.workflow_run.run_number }}
        run: |
          sed -i "s|IMAGE_PLACEHOLDER|$DOCKERHUB_REPO:$IMAGE_TAG|g" $K8S_MANIFESTS_DIR/deployment.yml

      - name: Deploy to EKS
        run: |
          kubectl apply -f $K8S_MANIFESTS_DIR/

      - name: Verify Deployment
        run: |
          kubectl rollout status deployment/3-tier-app-deployment -n $NAMESPACE --timeout=120s